services:
  postgres:
    image: postgres:17
    container_name: dess-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-dess}
      POSTGRES_USER: ${DB_USER:-dess}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - dess-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dess} -d ${DB_NAME:-dess}"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  dess-postgres-data:
